const fmt = (n, digits = 2) => {
  if (!isFinite(n) || n === 0) return '—';
  if (n < 0.01) return n.toExponential(2);
  if (n < 1) return n.toFixed(digits);
  if (n < 10) return n.toFixed(2);
  if (n < 100) return n.toFixed(1);
  return Math.round(n).toString();
};
