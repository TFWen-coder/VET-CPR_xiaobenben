    whyNoHighAG: 'High-AG acidosis (lactate, ketoacids) calls for treating the cause — the organic anions regenerate bicarbonate once metabolised, so giving bicarbonate risks rebound alkalosis, intracellular acidification and a fall in ionised calcium. Consider it only if pH < 7.1 and the patient is unresponsive to treatment of the cause.',

    sqTriggerTitle: 'Why Stewart applies to this case',
    sqt_albMask: 'Hypoalbuminaemia is masking unmeasured anions. Albumin is itself a weak acid, so a low concentration is alkalinising and offsets a coexisting organic acidosis. The traditional anion gap underestimates it and base excess does not show it — read the albumin-corrected gap and the semi-quantitative residual instead.',

    sqt_multi: 'Two or more independent components are each having a significant effect on base excess. A single pH or HCO₃⁻ is only the net sum and hides their individual size and direction.',

    org_uremia: 'Uraemic acidosis: check BUN, creatinine, SDMA and phosphate. Assess urine output and the need for dialysis in acute kidney injury.',
